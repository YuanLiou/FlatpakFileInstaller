# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Build this release tag (e.g. v1.0.0) and attach the files to its GitHub release
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Ubuntu 26.04 ships Qt 6.10 and KF 6.24, close to Fedora 44.
    container: ubuntu:26.04
    steps:
      # Before checkout, so that checkout finds git and keeps .git around.
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gettext extra-cmake-modules git ca-certificates \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev \
            libkirigami-dev libkf6i18n-dev libkf6coreaddons-dev libkf6archive-dev libglib2.0-dev \
            qml6-module-org-kde-kirigami qml6-module-org-kde-desktop qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtquick-dialogs qml6-module-qtqml-workerscript \
            qt6-svg-plugins appstream desktop-file-utils flatpak busybox-static python3
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Translations are up to date
        run: |
          sh scripts/update-translations.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --ignore-matching-lines='^"POT-Creation-Date:' --exit-code po/

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          # The action adds the architecture to the artifact name itself.
          bundle: FlatpakFileInstaller.flatpak
          manifest-path: packaging/flatpak/io.github.yuanliou.FlatpakFileInstaller.yml
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ matrix.arch }}-${{ inputs.tag || github.sha }}

  appimage:
    name: AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gettext extra-cmake-modules ca-certificates curl file \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-wayland \
            libkirigami-dev libkf6i18n-dev libkf6coreaddons-dev libkf6archive-dev libglib2.0-dev \
            qml6-module-org-kde-kirigami qml6-module-org-kde-desktop qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qtquick-dialogs qml6-module-qtqml-workerscript \
            qt6-svg-plugins
      - name: Build AppImage
        run: sh packaging/appimage/build-appimage.sh build-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: AppImage-${{ matrix.arch }}
          path: build-appimage/*.AppImage

  # On a v* tag (or a run started by hand for one), attach the Flatpak
  # bundles and AppImages to that tag's GitHub release, creating the
  # release if there isn't one yet.
  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [test, flatpak, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the version
        run: |
          version=$(sed -n 's/^project(flatpak-file-installer VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match the version in CMakeLists.txt ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files
        run: |
          mkdir upload
          for arch in x86_64 aarch64; do
            cp artifacts/FlatpakFileInstaller-$arch.flatpak/*.flatpak "upload/FlatpakFileInstaller-$VERSION-$arch.flatpak"
          done
          cp artifacts/AppImage-*/*.AppImage upload/
          (cd upload && sha256sum * > SHA256SUMS)
          ls -l upload
      - name: Upload
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Flatpak File Installer $VERSION" --generate-notes
          fi
          gh release upload "$TAG" upload/* --clobber
