# SPDX-License-Identifier: Apache-2.0
#
# Development manifest: builds the checked-out source tree.
# The Flathub submission uses the same file with the `dir` source replaced
# by a `git` source pinned to a release tag and commit.
id: io.github.yuanliou.FlatpakAppInstaller
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: flatpak-app-installer

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Installing apps means running the host's `flatpak` command through
  # `flatpak-spawn --host`; there is no narrower permission for that.
  - --talk-name=org.freedesktop.Flatpak
  # Files opened by double-click or dragged from a portal-aware file manager
  # arrive through the document portal. Browsers' download lists drag plain
  # paths instead, and downloads land here, so allow reading just this folder.
  - --filesystem=xdg-download:ro

cleanup:
  - /include
  - /lib/pkgconfig

modules:
  - name: flatpak-app-installer
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-appimage
          - .flatpak-builder
