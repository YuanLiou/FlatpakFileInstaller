# SPDX-License-Identifier: Apache-2.0
#
# Development manifest: builds the checked-out source tree.
# The Flathub submission uses the same file with the `dir` source replaced
# by a `git` source pinned to a release tag and commit.
id: io.github.yuanliou.FlatpakFileInstaller
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: flatpak-file-installer
# Keep translations in the app itself. By default flatpak-builder moves them
# into a separate .Locale extension, which a .flatpak bundle doesn't carry.
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Installing apps means running the host's `flatpak` command through
  # `flatpak-spawn --host`; there is no narrower permission for that.
  - --talk-name=org.freedesktop.Flatpak
  # The File, Settings and Help menus go to the desktop's global menu (KDE
  # Plasma) through this service. Without the permission the sandbox's bus
  # proxy hides it (tested: NameHasOwner is false and calls fail with
  # ServiceUnknown), the app finds no global menu, and the menus would be
  # missing. The settings page is still reachable with the gear button.
  - --talk-name=com.canonical.AppMenu.Registrar
  # Files opened by double-click or dragged from a portal-aware file manager
  # arrive through the document portal. Browsers' download lists drag plain
  # paths instead, and downloads land here, so allow reading just this folder.
  - --filesystem=xdg-download:ro
  # For a .flatpakref whose Flathub remote isn't set up yet, the app's
  # permissions are looked up on flathub.org before installing.
  - --share=network

# Kirigami, Kirigami Addons (FormCard, About page) and Qt.labs.platform come
# with the KDE runtime, so there is no module for them.

cleanup:
  - /include
  - /lib/pkgconfig

modules:
  - name: flatpak-file-installer
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    sources:
      - type: dir
        path: ../..
        skip:
          - build
          - build-appimage
          - .flatpak-builder
